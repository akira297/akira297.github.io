<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Обратная связь</title>
</head>

<body>

    <div class="container">

        <header>
            <h1>Food Construct</h1>
            <nav>
                <a href="info.html">О нас</a>
                <a href="index.html">Меню</a>
                <a href="boxes.html">Собрать ланч</a>
                <a href="#contacts">Контакты</a>
                <a href="feedback.html">Обратная связь</a>
                <a href="auth.html">Авторизация</a>
            </nav>
        </header>

        <main>
            <form action="https://httpbin.org/post"
                  method="POST" enctype="multipart/form-data">
                <h1>Форма обратной связи</h1>

                <!--label позволяет сделать так что бы позьзователь
            нажимал не только на форму но и на текст что бы
            начать вводить данные
            for - явная связь-->
                <label for="fullName">ФИО:</label>
                <input type="text" id="fullName" name="fullName"
                       с="Фамилия Имя Отчество"><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       required placeholder="example@example.com"><br>

                <label for="source">Откуда узнали о нас?</label><br>
                <input type="radio" id="radioFriend"
                       name="source" value="friend" checked>
                <label for="radioFriend">От друзей</label><br>

                <input type="radio" id="radioAd"
                       name="source" value="ad">
                <label for="radioAd">Реклама</label><br>

                <input type="radio" id="radioOther"
                       name="source" value="other">
                <label for="radioOther">Другое</label><br>

                <label for="appealType">Тип обращения:</label>
                <select id="appealType" name="appealType">
                    <option value="">Выберите тип обращения</option>
                    <option value="complaint">Жалоба</option>
                    <option value="proposal">Предложение</option>
                </select><br>

                <label for="messageText">Текст сообщения:</label>
                <textarea id="messageText" name="messageText"
                          rows="5" cols="30" required></textarea><br>

                <label for="attachment">Вложения:</label>
                <input type="file" id="attachment" name="attachment"><br>

                <label for="agreeDataProcessing">
                    <input type="checkbox" id="agreeDataProcessing"
                           name="agreeDataProcessing" required>
                    Я даю согласие на обработку моих персональных данных
                </label><br>

                <button type="submit">Отправить сообщение</button>
            </form>
        </main>

        <footer id="contacts">
            Адрес: Москва | Телефон: +1 (234) 567-89-10 | Email: Food@Construct.com
        </footer>

    </div>

</body>
</html>
