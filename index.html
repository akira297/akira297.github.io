<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан - Меню</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/print.css" media="print">
</head>
<body>
    <div class="container">
        <main>

            <h1>Выберите блюда</h1>

            <div id="filters">
                <label>Фильтр по типу:</label>
                <select id="filter-select">
                    <option value="all">Все</option>
                    <option value="soup">Супы</option>
                    <option value="main">Главное блюдо</option>
                    <option value="drink">Напиток</option>
                </select>
            </div>

            <!-- Только секция заказа остается статической, остальное создаст JS -->
            <section id="order-section">
                <h2>Сделать заказ</h2>
                <div class="order-container">
                    <div class="order-summary">
                        <h3>Ваш заказ</h3>
                        <ul id="order-items-list">
                        </ul>
                        <div class="order-total">
                            <strong>Итого:</strong>
                            <strong id="total-price">0₽</strong>
                        </div>
                    </div>
                    <div class="order-form">
                        <h3>Ваши данные</h3>
                        <form id="checkout-form" method="post">
                            <div class="form-group">
                                <label for="customer-name">ФИО:</label>
                                <input type="text" name="name" id="customer-name" required>
                            </div>
                            <div class="form-group">
                                <label for="customer-phone">Номер телефона:</label>
                                <input type="tel" id="customer-phone" name="phone" required>
                            </div>
                            <div class="form-group">
                                <label for="customer-address">Адрес доставки:</label>
                                <input type="text" id="customer-address" name="address" required>
                            </div>
                            <div class="form-group">
                                <label for="order-comments">Комментарии к заказу:</label>
                                <textarea id="vd3" rows="3" name="text"></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Заказать</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <footer id="contacts">
            Адрес: Москва | Телефон: +1 (234) 567-89-10 | Email: Food@Construct.com
        </footer>
    </div>

    <!-- Подключаем скрипты -->
    <script src="./script/list_dishes.js" charset="UTF-8"></script>
    <script src="./script/displayDishes.js" charset="UTF-8"></script>
</body>
</html>
