<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан - Меню</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/print.css" media="print">
</head>
<body>
    <div class="container">
        <main>
            <header>
                <h1>Food Construct</h1>
                <nav>
                    <a href="info.html">О нас</a>
                    <a href="index.html">Меню</a>
                    <a href="boxes.html">Собрать ланч</a>
                    <a href="#contacts">Контакты</a>
                    <a href="feedback.html">Обратная связь</a>
                    <a href="auth.html">Авторизация</a>
                </nav>
            </header>



            <!-- Только секция заказа остается статической, остальное создаст JS -->
            <section id="order-section">
                <h2>Сделать заказ</h2>
                <div class="order-container">
                    <div class="order-summary">
                        <h3>Ваш заказ</h3>
                        <ul id="order-items-list">
                        </ul>
                        <div class="order-total">
                            <strong>Итого:</strong>
                            <strong id="total-price">0₽</strong>
                        </div>
                    </div>
                    <div class="order-form">
                        <h3>Ваши данные</h3>
                        <form id="checkout-form" method="post">
                            <div class="form-group">
                                <label for="customer-name">ФИО:</label>
                                <input type="text" name="name" id="customer-name" required>
                            </div>
                            <div class="form-group">
                                <label for="customer-phone">Номер телефона:</label>
                                <input type="tel" id="customer-phone" name="phone" required>
                            </div>
                            <div class="form-group">
                                <label for="customer-address">Адрес доставки:</label>
                                <input type="text" id="customer-address" name="address" required>
                            </div>
                            <div class="form-group">
                                <label for="order-comments">Комментарии к заказу:</label>
                                <textarea id="vd3" rows="3" name="text"></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Заказать</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <footer id="contacts">
            Адрес: Москва | Телефон: +1 (234) 567-89-10 | Email: Food@Construct.com
        </footer>
    </div>

    <!-- Подключаем скрипты -->
    <script src="./script/list_dishes.js" charset="UTF-8"></script>
    <script src="./script/boxes.js" charset="UTF-8"></script>
    <script src="./script/orderCheck.js" charset="UTF-8"></script>

</body>
</html>
